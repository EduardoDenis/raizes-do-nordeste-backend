$kind: http-request
url: "{{baseUrl}}/pedidos/{{pedidoId}}/pagamento"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenCliente}}
body:
  type: json
  content: |-
    {
      "statusPagamento": "APROVADO"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 409", function () { pm.response.to.have.status(409); });
      pm.test("Erro no JSON padrao (error, message, timestamp, path)", function () {
        const j = pm.response.json();
        pm.expect(j.error).to.eql("STATUS_INVALIDO");
        pm.expect(j).to.have.property("message");
        pm.expect(j).to.have.property("timestamp");
        pm.expect(j).to.have.property("path");
      });
    language: text/javascript
order: 9000
