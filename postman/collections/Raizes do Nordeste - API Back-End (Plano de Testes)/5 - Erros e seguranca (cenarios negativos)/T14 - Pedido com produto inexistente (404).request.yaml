$kind: http-request
url: "{{baseUrl}}/pedidos"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenCliente}}
body:
  type: json
  content: |-
    {
      "canalPedido": "APP",
      "unidadeId": {{unidadeId}},
      "usuarioId": {{usuarioIdCliente}},
      "itens": [
        { "produtoId": 999999, "quantidade": 1 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 404", function () { pm.response.to.have.status(404); });
      pm.test("Erro no JSON padrao (error, message, timestamp, path)", function () {
        const j = pm.response.json();
        pm.expect(j.error).to.eql("NAO_ENCONTRADO");
        pm.expect(j).to.have.property("message");
        pm.expect(j).to.have.property("timestamp");
        pm.expect(j).to.have.property("path");
      });
    language: text/javascript
order: 7000
