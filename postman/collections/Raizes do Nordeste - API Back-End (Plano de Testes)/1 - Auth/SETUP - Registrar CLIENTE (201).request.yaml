$kind: http-request
url: "{{baseUrl}}/auth/registrar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Cliente Teste",
      "email": "{{emailCliente}}",
      "senha": "Senha@123",
      "perfil": "CLIENTE"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("emailCliente", "cliente." + Date.now() + "@teste.com");
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status 201 (usuario criado)", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 2000
