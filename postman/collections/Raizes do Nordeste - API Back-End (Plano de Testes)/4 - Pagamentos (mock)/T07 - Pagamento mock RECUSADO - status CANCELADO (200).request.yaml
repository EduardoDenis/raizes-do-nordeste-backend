$kind: http-request
name: T07 - Pagamento mock RECUSADO -> status CANCELADO (200)
url: "{{baseUrl}}/pedidos/{{pedidoRecusadoId}}/pagamento"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenCliente}}
body:
  type: json
  content: |-
    {
      "statusPagamento": "RECUSADO"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () { pm.response.to.have.status(200); });
      pm.test("Status do pedido atualizado para CANCELADO", function () { pm.expect(pm.response.json().status).to.eql("CANCELADO"); });
    language: text/javascript
order: 3000
