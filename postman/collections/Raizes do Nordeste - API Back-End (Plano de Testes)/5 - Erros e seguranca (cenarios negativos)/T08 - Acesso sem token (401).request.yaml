$kind: http-request
url: "{{baseUrl}}/pedidos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 401", function () { pm.response.to.have.status(401); });
      pm.test("Erro no JSON padrao (error, message, timestamp, path)", function () {
        const j = pm.response.json();
        pm.expect(j.error).to.eql("NAO_AUTENTICADO");
        pm.expect(j).to.have.property("message");
        pm.expect(j).to.have.property("timestamp");
        pm.expect(j).to.have.property("path");
      });
    language: text/javascript
order: 1000
