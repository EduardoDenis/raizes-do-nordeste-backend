# Valores lidos de variaveis de ambiente (veja backend/.env.example).
# Se a variavel nao existir, vale o padrao apos os dois-pontos (uso local de desenvolvimento).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/raizes_nordeste?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

api.security.token.secret=${JWT_SECRET:chave-secreta-projeto-uninter-2026}
